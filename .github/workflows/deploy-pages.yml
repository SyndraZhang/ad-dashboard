name: Deploy GitHub Pages
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==========【这里必须加你的构建命令！】==========
      # 示例（Vue / Vite）
      # - name: Install & Build
      #   run: |
      #     npm install
      #     npm run build
      # ==============================================

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist  # ⚠️ 重点！改成你打包输出目录，不要写 .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
